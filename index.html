<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Wars Login</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Splash Screen -->
    <input type="checkbox" id="splash-toggle" hidden />
    <label for="splash-toggle" id="splash">
      <img src="starwars.png" alt="Star Wars" id="splash-img" />
    </label>

    <!-- Live Clock -->
    <div
      id="live-clock"
      style="position: absolute; top: 20px; right: 20px; font-size: 2em; color: white; font-family: 'Star Jedi', sans-serif;"
    ></div>

    <!-- Login Section with Lightsabers -->
    <section id="login-section">
      <div class="login-wrapper">
        <!-- Left Lightsaber (Yoda) -->
        <div class="lightsaber-item">
          <div class="lightsaber">
            <label for="yoda-example"></label>
            <input type="checkbox" id="yoda-example" checked="checked" />
            <div class="switch"></div>
            <div class="plasma yoda"></div>
          </div>
          <h3 class="yoda-text">Yoda</h3>
          <h4 class="yoda-click">Click on saber</h4>
        </div>

        <!-- Login Form -->
        <div id="login" class="form-box">
          <div class="form-value">
            <form>
              <h2>Login</h2>
              <div class="inputbox">
                <ion-icon name="person-outline"></ion-icon>
                <input type="text" required />
                <label>username</label>
              </div>
              <div class="inputbox">
                <ion-icon name="lock-closed-outline"></ion-icon>
                <input type="password" required />
                <label>Password</label>
              </div>
              <div class="forget">
                <label><input type="checkbox" />Remember Me</label>
                <a href="#">Forgot Password</a>
              </div>
              <button>Log In</button>
              <div class="register">
                <p>Don't have an account? <a href="#">Sign Up</a></p>
              </div>
            </form>
          </div>
        </div>


        <!-- Right Lightsaber (Vader) -->
        <div class="lightsaber-item">
          <div class="lightsaber">
            <label for="darth-vader-example"></label>
            <input type="checkbox" id="darth-vader-example" checked="checked" />
            <div class="switch"></div>
            <div class="plasma vader"></div>
          </div>
          <h3 class="vader-text">vader</h3>
          <h4 class="vader-click">Click on saber</h4>
        </div>
      </div>
    </section>

    <!-- External JavaScript file -->
    <script src="script.js"></script>
  </body>
</html>
